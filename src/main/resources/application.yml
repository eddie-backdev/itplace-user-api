spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-migration-naming: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:20260722.0}
    baseline-description: existing-schema-before-flyway

  ai:
    chat:
      categorizePrompt: classpath:prompt/categorizePrompt.txt
      reasonPrompt: classpath:prompt/reasonPrompt.txt
    openai:
      base-url: https://api.openai.com/
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-5-nano}
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5-nano}
          temperature: ${OPENAI_CHAT_TEMPERATURE:1.0}
      embedding:
        model: text-embedding-3-small
      audio:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - account_email
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

elasticsearch:
  scheme: http
  connectTimeoutMs: 2000
  socketTimeoutMs: 30000

google:
  recaptcha:
    key:
      url: https://www.google.com/recaptcha/api/siteverify

app:
  security:
    abuse-protection:
      enabled: ${AUTH_ABUSE_PROTECTION_ENABLED:true}
      verification-issue-cooldown: ${AUTH_VERIFICATION_ISSUE_COOLDOWN:1m}
      verification-issue-window: ${AUTH_VERIFICATION_ISSUE_WINDOW:1h}
      verification-issue-per-identifier: ${AUTH_VERIFICATION_ISSUE_PER_IDENTIFIER:5}
      verification-issue-per-ip: ${AUTH_VERIFICATION_ISSUE_PER_IP:20}
      verification-confirm-window: ${AUTH_VERIFICATION_CONFIRM_WINDOW:10m}
      verification-confirm-per-identifier: ${AUTH_VERIFICATION_CONFIRM_PER_IDENTIFIER:10}
      verification-confirm-per-ip: ${AUTH_VERIFICATION_CONFIRM_PER_IP:50}
      login-ip-window: ${AUTH_LOGIN_IP_WINDOW:1m}
      login-per-ip: ${AUTH_LOGIN_PER_IP:30}
      login-failure-window: ${AUTH_LOGIN_FAILURE_WINDOW:15m}
      login-failure-threshold: ${AUTH_LOGIN_FAILURE_THRESHOLD:5}
      login-initial-lock: ${AUTH_LOGIN_INITIAL_LOCK:30s}
      login-max-lock: ${AUTH_LOGIN_MAX_LOCK:15m}
  map:
    cluster-summary:
      refresh:
        enabled: ${MAP_CLUSTER_SUMMARY_REFRESH_ENABLED:true}
        initial-delay-ms: ${MAP_CLUSTER_SUMMARY_REFRESH_INITIAL_DELAY_MS:60000}
        fixed-delay-ms: ${MAP_CLUSTER_SUMMARY_REFRESH_FIXED_DELAY_MS:300000}
        minimum-interval-ms: ${MAP_CLUSTER_SUMMARY_REFRESH_MINIMUM_INTERVAL_MS:240000}
  ai:
    indexing:
      enabled: ${AI_INDEXING_ENABLED:false}
    benefits:
      seed:
        enabled: ${BENEFIT_RAG_SEED_ENABLED:${AI_INDEXING_ENABLED:false}}
      sync:
        enabled: ${BENEFIT_RAG_SYNC_ENABLED:${AI_INDEXING_ENABLED:false}}
        initial-delay-ms: ${BENEFIT_RAG_SYNC_INITIAL_DELAY_MS:300000}
        fixed-delay-ms: ${BENEFIT_RAG_SYNC_FIXED_DELAY_MS:3600000}
        delay-ms: ${BENEFIT_RAG_SYNC_DELAY_MS:0}
    stores:
      seed:
        enabled: ${STORE_INDEX_SEED_ENABLED:${AI_INDEXING_ENABLED:false}}
  cookie:
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  oauth2:
    new-user-redirect-uri: ${OAUTH2_NEW_USER_REDIRECT_URI:http://localhost:5173/login?step=oauthIntegration&verifiedType=oauth}
    exist-user-redirect-uri: ${OAUTH2_EXIST_USER_REDIRECT_URI:http://localhost:5173/login?oauth=processing}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "prometheus"]
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
    elasticsearch:
      enabled: false
    redis:
      enabled: false
  metrics:
    tags:
      application: user-api
    distribution:
      percentiles-histogram:
        http.server.requests: true

octomo:
  api:
    base-url: ${OCTOMO_API_BASE_URL:https://api.octoverse.kr/octomo/v1}
    key: ${OCTOMO_API_KEY:}
  receiver-phone: ${OCTOMO_RECEIVER_PHONE:1666-3538}

kakao:
  local:
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
    rest-api-key: ${KAKAO_REST_API_KEY:}
