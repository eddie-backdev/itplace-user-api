spring:
  config:
    activate:
      on-profile: loadtest

  datasource:
    source:
      maximum-pool-size: ${PG_SOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${PG_SOURCE_MIN_IDLE:2}
      leak-detection-threshold: 0
    replica:
      maximum-pool-size: ${PG_REPLICA_MAX_POOL_SIZE:20}
      minimum-idle: ${PG_REPLICA_MIN_IDLE:10}
      leak-detection-threshold: 0

app:
  map:
    cluster-summary:
      refresh:
        enabled: false

logging:
  level:
    root: WARN
    com.itplace.userapi: WARN
    org.springframework.web: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
